# Versions of everything the JVM harness benchmarks. The harness writes the versions it
# reports into each result row from this file (see build.gradle.kts), so keep them here.
[versions]
kotlin = "2.5.0-Beta2"
# Amethyst's Nostr library: its Kite reader (quartz-kite, what Amethyst ships) and
# KotlinSerializationMapper (quartz-kotlinx, its native default) are the production parsers
# everything else is compared to. 2.16.0 is not on Maven Central (the release was refused for
# exceeding the free publishing limits), so it comes from JitPack, built from the v2.16.0 tag:
# com.github.vitorpamplona.quartz:quartz-jvm, version "v2.16.0". The rows report "2.16.0".
quartz = "v2.16.0"
# Jackson for the Jackson rows and the quartz-loop breakdown. Quartz brought it until 2.3.x
# (JacksonMapper, the quartz-jackson row) and dropped it in 2.4.0; it stays at 2.22.3, the
# version Quartz last used.
jackson = "2.22.3"
# The version Quartz 2.16.0 itself uses.
kotlinxSerialization = "1.12.0"
secp256k1 = "0.24.0"
gson = "2.14.0"
moshi = "1.15.2"
fastjson2 = "2.0.66"
dslJson = "2.0.2"
simdjson = "0.4.0"
orgJson = "20260814"
jsoniter = "0.9.23"
parsson = "1.1.9"
minimalJson = "0.9.5"
jsonSmart = "2.6.0"
jsoniterScala = "2.41.6"
scala3 = "3.10.0"
# Not a parser: the bytecode agent that counts allocations (allocs_per_event) in a
# separate, untimed child JVM. Apache-2.0 (checked against its published POM).
allocationInstrumenter = "3.3.5"
# The ASM the agent is rebuilt with (build.gradle.kts): 3.3.5 bundles an ASM that can't read
# Java 27 class files, the JDK's own included, so on JDK 27 it would count nothing. BSD-3-Clause.
asm = "9.10.1"

[libraries]
quartz = { group = "com.github.vitorpamplona.quartz", name = "quartz-jvm", version.ref = "quartz" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jackson" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
secp256k1-kmp-jni-jvm = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-jvm", version.ref = "secp256k1" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
fastjson2 = { group = "com.alibaba.fastjson2", name = "fastjson2", version.ref = "fastjson2" }
dsljson = { group = "com.dslplatform", name = "dsl-json", version.ref = "dslJson" }
simdjson = { group = "org.simdjson", name = "simdjson-java", version.ref = "simdjson" }
orgjson = { group = "org.json", name = "json", version.ref = "orgJson" }
jsoniter = { group = "com.jsoniter", name = "jsoniter", version.ref = "jsoniter" }
parsson = { group = "org.eclipse.parsson", name = "parsson", version.ref = "parsson" }
minimaljson = { group = "com.eclipsesource.minimal-json", name = "minimal-json", version.ref = "minimalJson" }
jsonsmart = { group = "net.minidev", name = "json-smart", version.ref = "jsonSmart" }
jsoniter-scala-core = { group = "com.github.plokhotnyuk.jsoniter-scala", name = "jsoniter-scala-core_3", version.ref = "jsoniterScala" }
jsoniter-scala-macros = { group = "com.github.plokhotnyuk.jsoniter-scala", name = "jsoniter-scala-macros_3", version.ref = "jsoniterScala" }
allocation-instrumenter = { group = "com.google.code.java-allocation-instrumenter", name = "java-allocation-instrumenter", version.ref = "allocationInstrumenter" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version.ref = "asm" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm" }
scala3-library = { group = "org.scala-lang", name = "scala3-library_3", version.ref = "scala3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
